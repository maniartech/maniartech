
# Pages

pages:
  - name: home
    path: /
    template: home.html
    # By default Taj Mahal runtime will find content from the
    # same name file by changing the extension to .md in the same directory.
    content: index.md # File
    title: Home

  - name: about
    path: /about/
    template: about.html
    title: About
    content: about.md # File

  - name: services
    path: /services/
    title: Services
    template: services.html

  - name: golang-migration
    path: /services/golang-migration/
    title: Golang Migration Services
    template: golang-migration.html

  - name: enterprise-digit-asset-management
    path: /services/enterprise-digit-asset-management/
    title: Enterprise Digital Asset Management
    template: enterprise-dam.html

  - name: business-process-automation
    path: /services/business-process-automation/
    title: Business Process Automation
    template: business-process-automation.html

  - name: products
    path: /products/
    title: Products
    template: products.html

  - name: careers
    path: /careers/
    title: Careers
    template: careers.html

  - name: contact
    path: /contact/
    title: Contact
    template: contact.html
    content: contact.md # File
