<div class="row row--15">

  <!-- Articles -->
  <div class="rn-blog-list-view mb--40">
    <div class="container">
      <div class="row">
        <!-- Start Single Blog  -->
        <div class="col-lg-12 col-12">
          <div class="rn-card box-card-style-default card-list-view h-auto">
            <div class="inner">
              <div class="thumbnail">
                <a class="image" href="blog-details.html">
                  <img src="{% assets 'images/blog-grid/blog-01.jpg' %}" alt="Blog Image">
                </a>
              </div>
              <div class="content">
                <h4 class="title">
                  <a href="blog-details.html">Think Your Magazine Is Safe? 5 Ways You Can Lose It Today.</a>
                </h4>
                <ul class="rn-meta-list">
                  <li><a href="#">Irin Pervin</a></li>
                  <li class="separator">/</li>
                  <li>10 Dec 2021</li>
                </ul>
                <p class="descriptiion">We have always known the power of digital
                  we've.
                </p>
              </div>
            </div>
          </div>
        </div>
        <!-- End Single Blog  -->
      </div>
    </div>
  </div>
  <!-- Articles -->

  {% for article in articles %}
  <div class="col-lg-6 col-md-6 col-12 d-flex" data-sal="slide-up" data-sal-duration="{{sal-duration}}">
    {% component blog_card article=article %}{% endcomponent %}
  </div>
  {% endfor %}

</div>
