# The `research` module - the Research top-level section: Insights (the blog /
# SEO engine) and White Papers (applied papers), one module per top-level menu
# item, per Aamir 2026-07-30. Two list/article collections; URLs unchanged.
# Page names stay `insights` / `white-papers` so the existing templates
# (insights.html, white-papers.html + dotted article shims) resolve untouched.

name: research

pages:
  - insights:
      path: /insights/*
      content: posts
      # Editorial shelf order = numeric filename prefixes (stripped from URLs).
      # Per-article frontmatter `order:` is NOT implemented; without this key
      # lists sort by date. `order: sort_order` is from a Provisional chapter -
      # verified against this binary on 2026-08-11 (see RESUME part 16).
      order: sort_order

  - white-papers:
      path: /white-papers/*
      content: papers
      # Same mechanism as insights above: reading order = numeric filename
      # prefixes (10/20/30, stripped from URLs), NOT frontmatter `order:`.
      # Sequence is deliberate - Cost Drivers first (procurement decision),
      # then Journey-First (architecture), then Gamification.
      order: sort_order

# All 13 insights posts must live on ONE page: the shelf filter is client-side,
# so a paginated index would silently filter only the current page.
page_size: 30
