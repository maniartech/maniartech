<!-- Start Banner Area  -->
<section class="slider-area slider-style-2 height-750 custom-bann rn-section-gapTop position-relative">
  <div class="hero-grid"></div>
  <div class="container">
    <div class="row row--30 align-items-center">
      <div class="order-1 order-md-1 order-lg-1 col-md-12 col-lg-7 mt_md--60 mt_sm--60 mt_lg--30">
        <div class="inner text-left">
          <h1 class="title sal-animate" data-sal="slide-left" data-sal-duration="700">{{ banner.heading | safe }}</h1>

          <div class="thumbnail d-flex justify-content-center  d-md-flex d-lg-none">
            <img src="{% assets 'images/about/innovation.png' %}" alt="Banner Images">
          </div>

          <p class="description sal-animate" data-sal="slide-up" data-sal-duration="800">
            {{ banner.content | safe }}
          </p>

          {% include "../banner-cta.html" %}

        </div>
      </div>
      <div class="order-2 order-md-2 order-lg-2 col-md-12 col-lg-5 mb_sm--100 d-none d-lg-block">
        <div class="thumbnail d-flex justify-content-center">
          <img src="{% assets 'images/about/innovation.png' %}" alt="Banner Images">
        </div>
      </div>
    </div>
  </div>
</section>
<!-- End Banner Area  -->
