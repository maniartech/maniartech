<!-- Start Vision Area  -->
<div class="service-area pb--80">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-5">
                <div class="content">
                    <h2 class="title sal-animate" data-sal="slide-up" data-sal-duration="700"> {{ vision.heading }}
                    </h2>
                </div>
            </div>
            <div class="col-lg-7 sal-animate" data-sal="slide-up" data-sal-duration="700">
                <div class="section-title text-left sal-animate" data-sal="slide-up" data-sal-duration="700"
                    data-sal-delay="100">
                    <span class="subtitle ml--0">
                        <span class="theme-gradient">{{ vision.subheading }}</span>
                    </span>
                </div>
                <p class="mb--10">
                    {{ vision.content | safe }}
                </p>
                <div class="section-title text-left sal-animate" data-sal="slide-up" data-sal-duration="700"
                    data-sal-delay="100">
                    <span class="subtitle ml--0">
                        <span class="theme-gradient">{{ mission.subheading }}</span>
                    </span>
                </div>
                <p class="mb--10">
                    {{ mission.content | safe }}
                </p>
            </div>
        </div>
    </div>
</div>
<!-- End Vision Area  -->
