<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ title }} — {{ site.name }}{% endblock %}</title>
    <meta name="description" content="{{ description }}">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&display=swap" rel="stylesheet">

    <!-- Static CSS (url()-bearing; served unprocessed) -->
    <link rel="stylesheet" href="{% assets "css/satoshi.css" %}">
    <link rel="stylesheet" href="{% assets "css/plugins.css" %}">
    <link rel="stylesheet" href="{% assets "css/backgrounds.css" %}">

    <!-- Theme stylesheet (SCSS, tree-shaken through the lib pipeline) -->
    {% lib "style.scss" %}

    {% block head_extra %}{% endblock %}
</head>

<body>

    <!-- Scroll-progress button (theme JS reads its SVG path) -->
    <div class="progress-wrap cursor-pointer">
        <svg class="progress-circle svg-content" width="100%" height="100%" viewBox="-1 -1 102 102">
            <path d="M50,1 a49,49 0 0,1 0,98 a49,49 0 0,1 0,-98" />
        </svg>
    </div>

    {% include "includes/header.html" %}

    <main class="main-bg">
        {% block content %}{% endblock %}
    </main>
    {% include "includes/footer.html" %}

    <!-- Vendor JS (pre-built / minified; served as static assets) -->
    <script src="{% assets "js/jquery-3.6.0.min.js" %}"></script>
    <script src="{% assets "js/jquery-migrate-3.4.0.min.js" %}"></script>
    <script src="{% assets "js/plugins.js" %}"></script>
    <script src="{% assets "js/gsap.min.js" %}"></script>
    <script src="{% assets "js/ScrollTrigger.min.js" %}"></script>

    <!-- Theme JS (source; bundled through the lib pipeline) -->
    {% lib "js/scripts.js" %}

    <!-- Smooth gear hover acceleration (overrides the CSS keyframe rotation) -->
    {% lib "js/gears.js" %}

    <!-- The fullscreen navigator (open/close + accordions) is driven by the theme's scripts.js -->


    {% block scripts_extra %}{% endblock %}
</body>

</html>
