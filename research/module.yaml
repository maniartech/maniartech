# The `research` module - the Research top-level section: Insights (the blog /
# SEO engine) and White Papers (applied papers), one module per top-level menu
# item, per Aamir 2026-07-30. Two list/article collections; URLs unchanged.
# Page names stay `insights` / `white-papers` so the existing templates
# (insights.html, white-papers.html + dotted article shims) resolve untouched.

name: research

pages:
  - insights:
      path: /insights/*
      content: posts

  - white-papers:
      path: /white-papers/*
      content: papers

# All 13 insights posts must live on ONE page: the shelf filter is client-side,
# so a paginated index would silently filter only the current page.
page_size: 30
