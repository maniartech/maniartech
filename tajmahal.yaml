# Taj Mahal site configuration.
# See https://github.com/maniartech/tajmahal for the full reference.

version: 1.0

# Site identity (read in templates as {{ site.name }} / {{ site.author }}).
name: "ManiarTech"
author: "Aamir Maniar"

# Active modules — each maps to a directory at the project root.
# One module per top-level menu item (Aamir, 2026-07-30): services / work /
# foundry / research, plus `site` for home, about, and the standalone pages.
modules:
  - site
  - services
  - work
  - foundry
  - research

# Theme (a directory under themeDir).
theme: maniartech
themeDir: themes

# Output directory for `tajmahal build` (generated site; safe to delete).
buildDir: build

# Default number of items per page on list pages.
page_size: 10

# Site-wide template variables (read as {{ site.context.<var> }}).
context:
  # Show publication dates on Insights posts (list + article + schema).
  # DECISION 2026-07: launched OFF. The launch batch is published together, and a cluster of
  # identical dates misrepresents work that actually spans years. Dates are NOT faked - the true
  # date stays in each post's frontmatter; it is simply not displayed yet.
  # FLIP TO true once there is ~6 months of newer content (then the launch set reads as the
  # founding batch, which is unremarkable). The dates revealed are the TRUE ones - the
  # Medium-origin posts carry their real 2024/2025 first-publication dates, which gives the
  # archive genuine depth at that point. Reminder tracked at CP-6M in METRICS-AND-CAPA.md.
  showPostDates: false

  # The Insights threads - THE single source of truth. The /insights/ page loops
  # this for the filter buttons, the four thread cards, and the label on every
  # index row. Adding or renaming a thread is a change HERE and nowhere else.
  # `key` must match the `thread:` value in each post's frontmatter.
  # Counts are never written here - they are computed from the posts at runtime,
  # because a typed count silently becomes a false claim the day a post is added.
  threads:
    - key: tools
      label: "Tools we author"
      short: "tools we author"
      title: "The formats and tools we author"
      blurb: "Why we build our own standards and libraries - the trade-offs, the dead ends, and what came out of it."
      lead: "/insights/we-author-standards/"
      leadLabel: "Why a small team authors standards"
    - key: process
      label: "How we work"
      short: "how we work"
      title: "How we work"
      blurb: "Senior-led delivery, a documented process, and how we decide something is actually ready to ship."
      lead: "/insights/dogfood-first/"
      leadLabel: "Dogfood first, then release"
    - key: cost
      label: "What things cost"
      short: "what things cost"
      title: "What things cost"
      blurb: "Honest looks at software cost and the decisions that really move it - including when not to build."
      lead: "/insights/cost-drivers-custom-software/"
      leadLabel: "What drives the cost"
    - key: domains
      label: "Systems and domains"
      short: "systems and domains"
      title: "Aging systems, and the domains we know"
      blurb: "Modernization without a big-bang rewrite, plus what fifteen years in laboratory and proptech systems taught us."
      lead: "/insights/rewrite-vs-refactor-strangler-fig/"
      leadLabel: "Rewrite or refactor?"

  # The four ENGAGEMENT MODELS (how we work together) - THE single source of
  # truth. /services/ loops this for its "How the work is structured" band, and
  # /partnerships/ loops it to show where the co-founder track sits among the
  # others. An engagement model is not a kind of software: the four engineering
  # PRACTICES are the separate axis, and any practice can run in any model.
  # `current` is matched by a page to mark its own row - never typed as markup.
  engagementModels:
    - key: assessment
      name: "Technical assessment and architecture review"
      when: "You have a system, a decision or a proposal and need an independent engineering verdict."
      what: "A written assessment: what is sound, what is at risk, what to do first, and what not to build."
    - key: delivery
      name: "Engineering delivery"
      when: "The work is scoped and someone has to own building it correctly."
      what: "A named senior team, staged delivery with exit gates, and a documented handover."
    - key: embedded
      name: "Embedded engineering partnership"
      when: "You have an internal team and need senior engineering capacity working inside it."
      what: "Our engineers in your process, under your priorities, with our review standards."
    - key: cofounder
      name: "Selective technology co-founder partnership"
      when: "You are building a company and want an engineering partner with skin in the game."
      what: "Deliberately rare, staged, and assessed against explicit criteria."
      url: "/partnerships/"

# Dev-server port (`tajmahal start`).
port: 8080

# The canonical absolute origin, used only for sitemap / canonical / og: URLs.
# Internal links and assets stay relative regardless, so the built site is
# portable. APEX chosen as canonical (the Pages CNAME already serves apex;
# www 301s to it). Decision 2026-07-23.
url: "https://maniartech.com"
