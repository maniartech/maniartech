<!-- Start Slider Area  -->
<section class="slider-area slider-style-2 variation-2 bg-transparent height-650 custom-lab-banner">
  <div class="hero-grid"></div>
  <div class="container">
    <div class="row row--30 align-items-center">
      <div class="col-12 col-lg-7">
        <div class="inner text-left">
          <h1 class="title">{{ banner.heading | safe }}</h1>
          <p class="description">{{ banner.description | safe }}</p>
        </div>

        {% include "../banner-cta.html" %}

      </div>

      <div class="col-12 col-lg-5 pl_lg--50 pr_lg--50 mt_sm--30 mt_md--30">
        <div class="thumbnail">
          <div class="hero-mosaic">
            <div class="mc accent-g sr d1 show">
              <div class="mc-icon ig">◈</div>
              <div class="mc-num">7<sup style="color:var(--color-heading);font-size:20px">+</sup></div>
              <div class="mc-label">// Products shipped</div>
            </div>
            <div class="mc accent-b sr d2 show">
              <div class="mc-icon ib">◎</div>
              <div class="mc-num" style="color:var(--color-primary)">5</div>
              <div class="mc-label">// Active research</div>
            </div>
            <div class="mc span2 sr d3 show">
              <div class="mc-row">
                <div class="mc-mini">
                  <div class="big">10</div>
                  <div class="sm">OSS repos</div>
                </div>
                <div class="mc-div"></div>
                <div class="mc-mini">
                  <div class="big">22</div>
                  <div class="sm">Total projects</div>
                </div>
                <div class="mc-div"></div>
                <div class="mc-mini">
                  <div class="big">∞</div>
                  <div class="sm">Ideas in queue</div>
                </div>
              </div>
              <div class="mc-bar">
                <div class="mc-bar-track">
                  <div class="mc-bar-fill go" id="bar"></div>
                </div>
                <div class="mc-bar-label"><span>shipped</span><span>78%</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
<!-- End Slider Area  -->
