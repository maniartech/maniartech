<div class="rn-card box-card-style-default card-list-view">
  <div class="inner">
    <div class="thumbnail">
      <a class="image" href="{{ article.url }}">
        <img src="{% assets 'images/blog-grid/blog-01.jpg' %}" alt="Blog Image">
      </a>
    </div>
    <div class="content">
      <h4 class="title">
        <a href="{{ article.url }}">{{ article.title }}</a>
      </h4>
      <ul class="rn-meta-list">
        <li><a href="#">{{ article.author }}</a></li>
        <li class="separator">/</li>
        <li>{{ article.date }}</li>
      </ul>
      <p class="descriptiion">{{ article.description }}</p>
    </div>
  </div>
</div>
