# The `services` module - the Services top-level section (one module per
# top-level menu item, per Aamir 2026-07-30). Hub + the four service pages.
# URLs unchanged from the old `site` module. Page name selects content
# (services/<name>/) and template (<name>.html) by convention.

name: services

pages:
