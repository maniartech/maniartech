{% extends "base.html" %}

{% block content %}

<!-- Product hero -->
<header class="main-header">
    <div class="container">
        <div class="row">
            <div class="col-lg-9">
                <a href="/products/" class="mt-eyebrow d-inline-block" style="color:rgba(255,255,255,.55);">← Products</a>
                {% if pageContext.productStatus %}
                <div><span class="mt-badge {% if pageContext.productStatus == "In production" %}is-live{% endif %} mt-15">{{ pageContext.productStatus }}</span></div>
                {% endif %}
                <h1 class="fw-bold mt-20 mb-20 prod-h1">{{ title }}</h1>
                <p class="lead-text">{{ description }}</p>
            </div>
        </div>
    </div>
</header>

<!-- Body (rendered from the product's markdown) -->
<section class="section-padding pt-0">
    <div class="container">
        <div class="row">
            <div class="col-lg-9 mt-prose">
                {{ content|safe }}
            </div>
        </div>
        <div class="row">
            <div class="col-lg-9">
                <div class="mt-actions mt-50 pt-40 bord-thin-top">
                    <a href="/estimate/" class="butn butn-md butn-rounded butn-bg main-colorbg"><span>Get a free project estimate</span></a>
                    <a href="/contact/" class="butn butn-md butn-rounded butn-bord text-light"><span>Talk to a human</span></a>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
